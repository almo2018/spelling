<title>拼字勇者 · Cambridge 英檢冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1c1533;
    --bg-deep2:#241b3d;
    --bg-panel:#31264f;
    --bg-panel2:#3b2d5e;
    --parchment:#f6ecd2;
    --parchment-dark:#e7d7ac;
    --gold:#eab04a;
    --gold-dark:#c9871e;
    --emerald:#4fb787;
    --emerald-dark:#357a58;
    --ruby:#e1584f;
    --ruby-dark:#a83c35;
    --sky:#5aa9e6;
    --ink:#3b2f1e;
    --text-light:#f6ecd2;
    --purple-line: #6a5596;
    color-scheme:dark;
    /* iPad 瀏海／狀態列／底部橫條的安全區域（全螢幕主畫面模式時內容不會被蓋住） */
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);
    padding-right:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, #3a2c63 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, #2c2350 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep2) 100%);
    min-height:100vh;
    min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    font-family:'Baloo 2','Noto Sans TC',-apple-system,'PingFang TC',sans-serif;
    color:var(--text-light);
    overflow-x:hidden;
    overscroll-behavior-y:none;        /* 避免下拉重新整理時誤觸 */
    touch-action:manipulation;         /* 快速連點不會放大畫面 */
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;   /* 長按不會跳出選取／拷貝選單 */
  }
  input,textarea{-webkit-user-select:text;user-select:text;}
  .pixel{font-family:'Press Start 2P',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding:14px 14px 64px;}

  /* ---------- shared ---------- */
  .panel{
    background:linear-gradient(180deg,var(--bg-panel) 0%, var(--bg-panel2) 100%);
    border:3px solid var(--purple-line);
    border-radius:16px;
    box-shadow:0 6px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.03);
    padding:16px;
  }
  .parchment{
    background:linear-gradient(180deg,var(--parchment) 0%, var(--parchment-dark) 100%);
    color:var(--ink);
    border-radius:14px;
    border:3px solid var(--gold-dark);
    box-shadow:0 4px 0 rgba(0,0,0,.25);
    padding:14px;
  }
  button{font-family:inherit;cursor:pointer;}
  .btn{
    border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;
    background:var(--gold);color:#4a3007;box-shadow:0 4px 0 var(--gold-dark);
    transition:transform .06s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark);}
  .btn.secondary{background:#4a3b78;color:var(--text-light);box-shadow:0 4px 0 #2b2050;}
  .btn.green{background:var(--emerald);color:#0e3324;box-shadow:0 4px 0 var(--emerald-dark);}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;align-items:center;gap:8px;}
  .between{justify-content:space-between;}
  .center{justify-content:center;text-align:center;}
  .wrap{flex-wrap:wrap;}
  .hidden{display:none !important;}
  .title-font{font-family:'Press Start 2P',monospace;line-height:1.6;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .coin{background:var(--gold);color:#4a3007;border-radius:20px;padding:5px 12px;font-weight:800;font-size:13px;}
  .accent-toggle{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:20px;}
  .accent-toggle button{border:none;border-radius:16px;padding:5px 10px;font-size:12px;font-weight:800;background:transparent;color:#cbbcee;}
  .accent-toggle button.active{background:var(--sky);color:#0b2c47;}

  /* ---------- title ---------- */
  #screen-title{text-align:center;padding-top:40px;}
  #screen-title h1{font-size:20px;margin-bottom:8px;color:var(--gold);text-shadow:0 3px 0 #5a3a10;}
  #screen-title .sub{color:#cbbcee;margin-bottom:26px;font-size:15px;}
  .hero-emoji{font-size:70px;margin:14px 0;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  /* ---------- map ---------- */
  .map-title{text-align:center;margin-bottom:14px;}
  .map-title h2{font-size:14px;color:var(--gold);}
  .worldmap{position:relative;padding:10px 0 20px;}
  .node-wrap{display:flex;margin-bottom:6px;}
  .node-wrap.left{justify-content:flex-start;}
  .node-wrap.right{justify-content:flex-end;}
  .kingdom-node{
    width:120px;text-align:center;position:relative;
  }
  .kingdom-node .badge{
    width:74px;height:74px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:34px;
    background:radial-gradient(circle at 30% 25%, #5a4a8a, #2c2350);
    border:4px solid var(--purple-line);
    box-shadow:0 4px 0 rgba(0,0,0,.4);
    margin:0 auto 6px;
    position:relative;
  }
  .kingdom-node.locked .badge{filter:grayscale(1) brightness(.6);}
  .kingdom-node.cleared .badge{border-color:var(--gold);box-shadow:0 0 0 3px rgba(234,176,74,.35), 0 4px 0 rgba(0,0,0,.4);}
  .kingdom-node .lock-icon{position:absolute;top:-4px;right:6px;font-size:16px;}
  .kingdom-node .name{font-size:12px;font-weight:800;color:var(--text-light);}
  .kingdom-node .stars{font-size:11px;color:var(--gold);height:14px;}
  .dash-line{width:3px;flex:1;background:repeating-linear-gradient(180deg, var(--purple-line) 0 6px, transparent 6px 12px);margin:0 auto;}
  .dash-wrap{display:flex;justify-content:center;height:20px;}

  .map-footer{display:flex;gap:8px;margin-top:16px;}
  .map-footer .btn{flex:1;}

  /* ---------- battle ---------- */
  .battle-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .hp-wrap{flex:1;margin:0 8px;}
  .hp-bar-bg{background:#1c1533;border-radius:10px;height:14px;overflow:hidden;border:2px solid #000;}
  .hp-bar{height:100%;background:linear-gradient(90deg,#ff8a80,#e1584f);transition:width .3s ease;}
  .hp-bar.player{background:linear-gradient(90deg,#8affc1,#4fb787);}
  .monster-stage{text-align:center;padding:10px 0 4px;position:relative;}
  .monster-emoji{font-size:64px;display:inline-block;transition:transform .15s ease;}
  .monster-emoji.hit{animation:shake-monster .3s;}
  @keyframes shake-monster{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) scale(.95)}75%{transform:translateX(8px) scale(.95)}}
  .monster-emoji.defeat{animation:defeat .5s forwards;}
  @keyframes defeat{to{transform:scale(0) rotate(30deg);opacity:0}}
  .queue-count{font-size:12px;color:#cbbcee;margin-top:2px;}

  .clue-box{text-align:center;margin:14px 0;}
  .clue-mode-label{font-size:11px;color:var(--sky);font-weight:800;margin-bottom:4px;}
  .clue-image{font-size:56px;}
  .clue-meaning{font-size:26px;font-weight:900;color:var(--gold);font-family:'Noto Sans TC',sans-serif;}
  .sound-row{display:flex;justify-content:center;gap:8px;margin-top:8px;}
  .sound-btn{border:none;background:var(--sky);color:#0b2c47;border-radius:20px;padding:7px 14px;font-weight:800;font-size:13px;box-shadow:0 3px 0 #2f6ea3;}
  .sound-btn.mic{background:var(--emerald);box-shadow:0 3px 0 var(--emerald-dark);}

  .blanks{display:flex;justify-content:center;gap:6px;margin:16px 0 10px;flex-wrap:wrap;}
  .blank{
    width:calc(var(--bw,38px)*var(--k,1));height:calc(var(--bh,44px)*var(--k,1));border-radius:8px;background:var(--parchment);
    color:var(--ink);font-weight:900;font-size:calc(var(--bf,20px)*var(--k,1));
    display:flex;align-items:center;justify-content:center;
    border-bottom:4px solid var(--gold-dark);font-family:'Noto Sans TC',sans-serif;
  }
  .blank.wrong-flash{background:#ffd3d0;border-bottom-color:var(--ruby-dark);}
  .blank.reveal{background:#ffe9b0;}

  .tiles{display:flex;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap;}
  .tile{
    width:calc(var(--tw,44px)*var(--k,1));height:calc(var(--th,46px)*var(--k,1));border-radius:10px;border:none;
    background:linear-gradient(180deg,#fff 0%, var(--parchment) 100%);
    color:var(--ink);font-weight:900;font-size:calc(var(--tf,20px)*var(--k,1));box-shadow:0 4px 0 var(--gold-dark);
  }
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark);}
  .tile:disabled{opacity:.25;box-shadow:none;}
  .tile.wrong-shake{animation:shake .3s;background:#ffd3d0;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .action-row{display:flex;justify-content:center;gap:8px;margin-top:6px;}
  .feedback{text-align:center;min-height:22px;font-weight:800;margin-top:6px;font-size:14px;}
  .feedback.good{color:var(--emerald);}
  .feedback.bad{color:var(--ruby);}

  /* ---------- report/dashboard ---------- */
  .report-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--gold-dark);}
  .report-item:last-child{border-bottom:none;}
  .stat-big{font-size:34px;font-weight:900;color:var(--gold-dark);text-align:center;}
  .stat-label{text-align:center;font-size:12px;color:#6b5636;margin-top:-6px;}
  .tag{display:inline-block;background:#fff3d6;border:1px solid var(--gold-dark);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;margin:2px;color:#6b4b12;}
  .weak-word-row{display:flex;justify-content:space-between;background:#fff3d6;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-weight:700;}
  .section-title{font-weight:900;font-size:14px;margin:14px 0 6px;color:#5b3f10;border-left:5px solid var(--gold-dark);padding-left:8px;}
  .avatar-msg{background:#2c2350;border:2px solid var(--purple-line);border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px;}
  /* ---------- 新增：地圖卡片、設定頁、存檔提示 ---------- */
  .k-list{display:flex;flex-direction:column;gap:8px;}
  .k-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;
    background:linear-gradient(180deg,var(--bg-panel) 0%, var(--bg-panel2) 100%);
    border:2px solid var(--purple-line);box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer;}
  .k-card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .k-card.locked{opacity:.45;cursor:not-allowed;}
  .k-icon{font-size:28px;width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 25%, #5a4a8a, #2c2350);border-radius:50%;border:2px solid var(--purple-line);}
  .k-body{flex:1;min-width:0;}
  .k-name{font-size:14px;font-weight:800;margin-bottom:4px;}
  .k-stars{font-size:11px;color:var(--gold);}
  .k-bar-bg{background:#1c1533;border-radius:8px;height:9px;overflow:hidden;border:1px solid #000;position:relative;}
  .k-bar{height:100%;background:linear-gradient(90deg,#7fd4ff,#5aa9e6);transition:width .4s ease;}
  .k-bar-master{height:100%;background:linear-gradient(90deg,#ffd97a,#eab04a);transition:width .4s ease;
    position:absolute;left:0;top:0;}
  .k-meta{font-size:11px;color:#bcabe6;margin-top:4px;}
  .due-dot{color:var(--gold);font-weight:800;margin-left:6px;}

  .stat-strip{display:flex;gap:6px;}
  .stat-strip>div{flex:1;text-align:center;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 4px;}
  .stat-strip b{display:block;font-size:20px;color:var(--gold);}
  .stat-strip span{font-size:11px;color:#bcabe6;}

  .streak-pill{display:inline-block;background:#4a3b78;border:2px solid var(--gold);border-radius:20px;
    padding:5px 14px;font-size:13px;font-weight:800;margin-top:6px;}
  .streak-line{background:#fff3d6;border-radius:10px;padding:8px;text-align:center;font-weight:800;
    color:#6b4b12;font-size:13px;margin-top:12px;}

  .save-badge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#2c2350;
    border:2px solid var(--emerald);color:#8affc1;border-radius:20px;padding:5px 14px;font-size:11px;
    font-weight:800;cursor:pointer;z-index:20;}
  .save-badge.warn{border-color:var(--ruby);color:#ffb3ae;}
  .autosave-note{text-align:center;font-size:10px;color:#9d8dc4;margin-top:8px;}

  .warn-box{background:#ffe0de;border:2px solid var(--ruby-dark);border-radius:10px;padding:10px;
    font-size:12px;color:#7a2b25;line-height:1.6;}
  .ok-box{background:#dff5e8;border:2px solid var(--emerald-dark);border-radius:10px;padding:10px;
    font-size:12px;color:#1e5238;line-height:1.6;}
  .chip{border:2px solid var(--gold-dark);background:#fff3d6;color:#6b4b12;border-radius:20px;
    padding:6px 14px;font-size:13px;font-weight:800;}
  .chip.on{background:var(--gold);color:#4a3007;}
  .hint{font-size:11px;color:#7a6440;margin-top:6px;line-height:1.6;}
  .code-box{width:100%;height:64px;margin-top:8px;margin-bottom:6px;border-radius:8px;
    border:2px solid var(--gold-dark);padding:8px;font-size:10px;font-family:monospace;
    background:#fffaf0;color:#4a3007;resize:vertical;}
  .btn.danger{background:var(--ruby);color:#fff;box-shadow:0 4px 0 var(--ruby-dark);}
  .sound-btn.us{background:var(--gold);color:#4a3007;box-shadow:0 3px 0 var(--gold-dark);}

  /* ---------- 勇者選擇／新增 ---------- */
  .pf-head{font-weight:800;font-size:14px;margin-bottom:10px;color:#dcd0ff;}
  .pf-list{display:flex;flex-direction:column;gap:8px;}
  .pf-card{display:flex;flex-direction:column;align-items:stretch;background:rgba(0,0,0,.22);border:2px solid var(--purple-line);border-radius:14px;overflow:hidden;}
  .pf-main{flex:none;display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer;min-width:0;}
  .pf-main:active{background:rgba(255,255,255,.06);}
  .pf-avatar{font-size:32px;width:50px;height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 25%, #5a4a8a, #2c2350);border-radius:50%;border:2px solid var(--gold);}
  .pf-info{min-width:0;}
  .pf-name{font-weight:900;font-size:16px;}
  .pf-last{font-size:10px;background:var(--gold);color:#4a3007;border-radius:8px;padding:1px 6px;vertical-align:2px;}
  .pf-meta{font-size:11px;color:#bcabe6;}
  .pf-tools{display:flex;border-top:2px solid var(--purple-line);}
  .pf-tools button{flex:1;border:none;background:transparent;color:var(--text-light);font-family:inherit;font-weight:800;font-size:14px;padding:0 6px;min-height:48px;cursor:pointer;}
  .pf-tools button+button{border-left:1px solid var(--purple-line);}
  .pf-tools button:active{background:rgba(255,255,255,.08);}
  .hint-light{font-size:11px;color:#9d8dc4;margin-top:10px;line-height:1.7;text-align:center;}
  .np-label{font-weight:900;font-size:14px;margin:16px 0 6px;color:var(--gold);}
  .np-label:first-child{margin-top:0;}
  .np-input{width:100%;font-size:18px;font-family:inherit;font-weight:700;padding:10px 12px;border-radius:12px;
    border:3px solid var(--purple-line);background:#1c1533;color:var(--text-light);}
  .np-input:focus{outline:none;border-color:var(--gold);}
  .np-avatars{display:flex;flex-wrap:wrap;gap:6px;}
  .np-av{width:46px;height:46px;font-size:26px;border-radius:12px;border:2px solid var(--purple-line);background:rgba(0,0,0,.25);cursor:pointer;}
  .np-av.on{border-color:var(--gold);background:#4a3b78;box-shadow:0 0 0 2px rgba(234,176,74,.4);}
  .np-levels{display:flex;flex-direction:column;gap:6px;}
  .np-lv{text-align:left;border:2px solid var(--purple-line);background:rgba(0,0,0,.25);color:var(--text-light);
    border-radius:12px;padding:9px 12px;font-family:inherit;font-size:13px;cursor:pointer;}
  .np-lv span{display:block;font-size:11px;color:#bcabe6;margin-top:2px;}
  .np-lv.on{border-color:var(--gold);background:#4a3b78;}

  /* ---------- 首頁 ---------- */
  .home-head{display:flex;align-items:center;gap:10px;margin-top:4px;}
  .home-av{font-size:34px;width:56px;height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 25%, #5a4a8a, #2c2350);border-radius:50%;border:3px solid var(--gold);}
  .home-name{font-weight:900;font-size:20px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .home-sub{font-size:12px;color:#bcabe6;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .home-tile{border:2px solid var(--purple-line);background:rgba(0,0,0,.22);color:var(--text-light);border-radius:14px;
    padding:10px 6px;font-family:inherit;font-size:24px;cursor:pointer;line-height:1.3;}
  .home-tile b{display:block;font-size:14px;}
  .home-tile span{display:block;font-size:10px;color:#bcabe6;font-weight:600;}
  .home-tile.dim{opacity:.5;}
  .cp-row{cursor:pointer;}

  /* ---------- 地圖：關卡標題、技能卡 ---------- */
  .chap-title{text-align:center;font-weight:900;color:var(--gold);font-size:14px;margin:-4px 0 10px;}
  .skill-row{display:flex;gap:8px;margin-bottom:12px;}
  .skill-card{flex:1;border:2px solid var(--gold-dark);background:linear-gradient(180deg,#4a3b78,#3b2d5e);color:var(--gold);
    border-radius:14px;padding:10px 6px;font-family:inherit;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);}
  .skill-card span{display:block;font-size:10px;color:#dcd0ff;font-weight:600;margin-top:3px;}
  .sec-head{font-weight:900;font-size:13px;color:#dcd0ff;margin:4px 0 8px;}

  /* ---------- 文法道場 ---------- */
  .hub-title{text-align:center;font-weight:900;font-size:18px;color:var(--gold);margin-bottom:10px;}
  .hub-sub{text-align:center;font-size:12px;color:#bcabe6;margin-bottom:10px;}
  .g-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .g-mode{border:2px solid var(--purple-line);background:rgba(0,0,0,.25);color:var(--text-light);border-radius:12px;
    padding:10px 4px;font-family:inherit;font-size:22px;cursor:pointer;line-height:1.3;}
  .g-mode b{display:block;font-size:13px;color:var(--gold);}
  .g-mode span{display:block;font-size:10px;color:#bcabe6;font-weight:600;}
  .gp-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px dashed var(--purple-line);cursor:pointer;}
  .gp-name{flex:0 0 40%;font-size:13px;font-weight:800;}
  .gp-bar{flex:1;height:8px;background:#1c1533;border-radius:6px;overflow:hidden;border:1px solid #000;}
  .gp-fill{height:100%;background:linear-gradient(90deg,#8affc1,#4fb787);}
  .gp-fill.low{background:linear-gradient(90deg,#ff8a80,#e1584f);}
  .gp-num{flex:0 0 46px;text-align:right;font-size:11px;color:#bcabe6;}
  .g-point{text-align:center;font-size:11px;color:var(--sky);font-weight:800;margin:8px 0 4px;}
  .g-type{text-align:center;font-size:12px;color:#bcabe6;font-weight:800;margin-bottom:8px;}
  .g-sentence{background:var(--parchment);color:var(--ink);border-radius:12px;padding:14px;font-size:19px;font-weight:800;
    text-align:center;line-height:1.7;}
  .gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--gold-dark);color:var(--gold-dark);padding:0 4px;}
  .gap.ok{color:var(--emerald-dark);border-color:var(--emerald);}
  .gap.bad{color:var(--emerald-dark);border-color:var(--ruby);}
  .g-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .g-opt{border:none;border-radius:12px;padding:12px;font-size:17px;font-weight:800;font-family:inherit;
    background:linear-gradient(180deg,#fff,var(--parchment));color:var(--ink);box-shadow:0 4px 0 var(--gold-dark);cursor:pointer;}
  .g-opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark);}
  .g-opt.right{background:#c8f5dc;box-shadow:0 4px 0 var(--emerald-dark);}
  .g-opt.wrong{background:#ffd3d0;box-shadow:0 4px 0 var(--ruby-dark);}
  .g-opt:disabled{cursor:default;transform:none;}
  .g-zh{text-align:center;font-size:20px;font-weight:900;color:var(--gold);font-family:'Noto Sans TC',sans-serif;margin-bottom:10px;}
  .ro-built{min-height:58px;background:var(--parchment);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;
    align-items:center;justify-content:center;}
  .ro-built.shake{animation:shake .35s;background:#ffd3d0;}
  .ro-hint{font-size:12px;color:#8a7650;text-align:center;}
  .ro-chip{border:none;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:800;font-family:inherit;background:#4a3b78;
    color:#fff;cursor:pointer;}
  .ro-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 6px;min-height:46px;}
  .ro-tile{border:none;border-radius:10px;padding:10px 12px;font-size:17px;font-weight:800;font-family:inherit;
    background:linear-gradient(180deg,#fff,var(--parchment));color:var(--ink);box-shadow:0 4px 0 var(--gold-dark);cursor:pointer;}
  .ro-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark);}
  .g-result{margin-top:12px;border-radius:12px;padding:12px;background:#dff5e8;color:#1e5238;border:2px solid var(--emerald-dark);}
  .g-result.bad{background:#ffe0de;color:#7a2b25;border-color:var(--ruby-dark);}
  .g-verdict{font-weight:900;font-size:15px;}
  .g-answer{font-size:17px;font-weight:900;margin:6px 0;color:#3b2f1e;}
  .g-exp{font-size:12px;line-height:1.6;margin:6px 0 8px;}
  .fix-row{background:#fff3d6;border-radius:10px;padding:8px 10px;margin-bottom:6px;}
  .fix-q{font-size:13px;color:#6b5636;}
  .fix-a{font-size:14px;font-weight:900;color:#1e5238;margin-top:2px;}
  .fix-e{font-size:11px;color:#7a6440;margin-top:2px;}

  /* ---------- 閱讀測驗 ---------- */
  .rd-list{display:flex;flex-direction:column;gap:8px;}
  .rd-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(0,0,0,.22);
    border:2px solid var(--purple-line);cursor:pointer;}
  .rd-icon{font-size:26px;}
  .rd-body{flex:1;min-width:0;}
  .rd-title{font-weight:900;font-size:14px;}
  .rd-sub{font-size:11px;color:#bcabe6;}
  .rd-score{background:#4a3b78;border:2px solid var(--sky);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:900;}
  .rd-score.full{border-color:var(--gold);color:var(--gold);}
  .rd-new{background:var(--ruby);color:#fff;border-radius:8px;padding:2px 6px;font-size:10px;font-weight:900;}
  .rd-passage{background:var(--parchment);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.75;
    border:3px solid var(--gold-dark);}
  .rd-passage p{margin:0 0 10px;}
  .rd-passage p:last-child{margin-bottom:0;}
  .rd-ptitle{font-weight:900;font-size:17px;text-align:center;margin-bottom:8px;color:#5b3f10;}
  .rq-list{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .rq{background:rgba(0,0,0,.2);border-radius:12px;padding:10px;border:2px solid var(--purple-line);}
  .rq-num{font-size:11px;color:var(--sky);font-weight:900;}
  .rq-q{font-weight:800;font-size:15px;margin:4px 0 8px;}
  .notice-box{background:#fffaf0;color:#2b2418;border:2px dashed #8a7650;border-radius:10px;padding:10px 12px;font-size:14px;
    line-height:1.6;margin:6px 0;font-weight:600;}
  .ropt{display:block;width:100%;text-align:left;border:2px solid transparent;border-radius:10px;padding:9px 10px;margin-bottom:6px;
    font-size:14px;font-family:inherit;background:var(--parchment);color:var(--ink);cursor:pointer;font-weight:600;}
  .ropt b{display:inline-block;width:22px;color:var(--gold-dark);}
  .ropt.picked{border-color:var(--sky);background:#d9ecfb;}
  .ropt.right{border-color:var(--emerald);background:#c8f5dc;}
  .ropt.wrong{border-color:var(--ruby);background:#ffd3d0;}
  .ropt:disabled{cursor:default;}
  .rexp{font-size:12px;border-radius:8px;padding:6px 8px;line-height:1.6;}
  .rexp.ok{background:#dff5e8;color:#1e5238;}
  .rexp.bad{background:#ffe0de;color:#7a2b25;}
  .rd-result{text-align:center;background:rgba(0,0,0,.25);border:2px solid var(--gold);border-radius:12px;padding:10px;
    margin-bottom:10px;font-weight:800;font-size:13px;}

  /* ---------- 章節分頁 / 章節進度 ---------- */
  .chap-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .chap-tab{flex:1;border:2px solid var(--purple-line);background:rgba(0,0,0,.25);color:#bcabe6;
    border-radius:12px;padding:8px 4px;font-size:12px;font-weight:800;font-family:inherit;line-height:1.4;}
  .chap-tab span{display:block;font-size:10px;opacity:.8;font-weight:600;}
  .chap-tab.on{background:linear-gradient(180deg,var(--bg-panel) 0%, var(--bg-panel2) 100%);
    border-color:var(--gold);color:var(--gold);}
  .chap-progress{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .cp-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#bcabe6;}
  .cp-name{flex:0 0 96px;font-weight:800;}
  .cp-bar{flex:1;height:8px;background:#1c1533;border-radius:6px;overflow:hidden;border:1px solid #000;}
  .cp-fill{height:100%;background:linear-gradient(90deg,#ffd97a,#eab04a);}
  .cp-num{flex:0 0 56px;text-align:right;}
  .locked-chapter{background:linear-gradient(180deg,var(--bg-panel) 0%, var(--bg-panel2) 100%);
    border:3px solid var(--purple-line);border-radius:16px;padding:20px 16px;text-align:center;}
  .lc-title{font-size:15px;font-weight:900;color:var(--gold);margin:8px 0;}
  .lc-desc{font-size:13px;color:#dcd0ff;line-height:1.7;}
  .lc-meta{font-size:11px;color:#bcabe6;}
  .unlock-banner{background:linear-gradient(180deg,#fff3d6,#ffe4a8);border:3px solid var(--gold-dark);
    border-radius:12px;padding:12px;text-align:center;font-size:14px;font-weight:800;color:#6b4b12;

(function buildLevelWords(){
  // 新版 Unicode（Emoji 12 以後）在較舊的手機、平板常顯示成方框
  const risky = s => [...s].some(ch=>{
    const cp = ch.codePointAt(0);
    return (cp>=0x1FA70&&cp<=0x1FAFF)||(cp>=0x1F7E0&&cp<=0x1F7F0)||(cp>=0x1F6D5&&cp<=0x1F6D7)||
           (cp>=0x1F6DC&&cp<=0x1F6DF)||(cp>=0x1F6FA&&cp<=0x1F6FC)||(cp>=0x1F90C&&cp<=0x1F90F)||
           cp===0x1F93F||cp===0x1F971||cp===0x1F972||cp===0x1F977||cp===0x1F978||cp===0x1F97B||
           (cp>=0x1F9A3&&cp<=0x1F9AF)||(cp>=0x1F9BA&&cp<=0x1F9BF)||(cp>=0x1F9C3&&cp<=0x1F9CF);
  });
  const known = new Set(WORDS.map(w=>w.word));
  const usedImg = new Map();                       // 圖示 → 已經用它的單字（避免同圖不同答案）
  WORDS.forEach(w=>{
    if(w.mode==='meaning') return;
    const v = w.swatch || w.emoji;
    if(v && !usedImg.has(v)) usedImg.set(v, w.word);
  });
  for(const [cat, block] of Object.entries(LEVEL_WORDS)){
    const pre = cat.split('-')[0];
    block.split('\n').forEach(line=>{
      const parts = line.split('|').map(s=>s.trim());
      const word = (parts[0]||'').toLowerCase(), zh = parts[1];
      let vis = parts[2] || '';
      if(!word || !zh || known.has(word)) return;  // 前面關卡已有 → 略過
      known.add(word);
      const w = {id:pre+'-'+word, word, zh, emoji:'📝', category:cat};
      if(vis && vis[0]!=='#' && risky(vis)) vis = '';
      if(vis && usedImg.has(vis) && usedImg.get(vis)!==word) vis = '';
      if(!vis) w.mode = 'meaning';
      else if(vis[0]==='#'){ w.swatch = vis; w.emoji = '🎨'; usedImg.set(vis, word); }
      else { w.emoji = vis; usedImg.set(vis, word); }
      WORDS.push(w);
    });
  }
})();

const GRAMMAR = [];
(function buildGrammar(){
  const hash = s=>{ let x=5381; for(const c of s) x=((x<<5)+x+c.charCodeAt(0))|0; return (x>>>0).toString(36); };
  for(const [level, src] of Object.entries(GRAMMAR_SRC)){
    (src.mc||'').split('\n').forEach(line=>{
      const p = line.split('|').map(s=>s.trim());
      if(p.length<5) return;
      GRAMMAR.push({id:'g'+hash(level+p[1]), level, t:'mc', g:p[0], q:p[1],
                    o:p[2].split('/').map(s=>s.trim()), a:+p[3], e:p[4]});
    });
    (src.ro||'').split('\n').forEach(line=>{
      const p = line.split('|').map(s=>s.trim());
      if(p.length<3) return;
      GRAMMAR.push({id:'g'+hash(level+p[2]), level, t:'ro', g:p[0], zh:p[1], s:p[2], e:p[3]||''});
    });
  }
})();

{id:"r4-4", level:"pet", type:"article", title:"Why Do Teenagers Need So Much Sleep?", sub:"健康科學文章",
 text:`Scientists say teenagers need between eight and ten hours of sleep every night, which is more than most adults. Yet surveys show that many get fewer than seven.

One reason is that the body's natural clock changes during the teenage years. Many teenagers don't feel tired until 11 p.m. or later, even when they have to get up early for school.

Screens make the problem worse. The light from phones and tablets tells the brain that it is still daytime. Experts suggest switching off all devices at least an hour before bed.

{id:"r4-6", level:"pet", type:"article", title:"My Volunteer Summer", sub:"經驗分享",
 text:`Last summer, instead of going on holiday, I spent four weeks as a volunteer at a wildlife centre on the coast. I'd always been interested in animals, but I had no idea how much work it would be!

Every morning started at 6.30 with feeding time. The centre looks after injured birds and seals until they are strong enough to go back to the wild. At first, I was only allowed to clean the cages, which wasn't exactly exciting. But after the first week, the staff trusted me to help prepare food and check on the animals.

The best moment came at the end of my stay. A young seal we had looked after for weeks was finally returned to the sea. Watching it swim away made all the hard work worth it.

I'd recommend volunteering to anyone. You learn new skills, meet people with the same interests, and do something useful for the environment.`,
 questions:[
 {q:"Why did the writer choose to volunteer?", o:["Someone in the family made the writer do it.","The writer had always been interested in animals.","The writer needed money for a holiday."], a:1, e:"I'd always been interested in animals."},
 {q:"What was the writer's job at the beginning?", o:["preparing food","cleaning the cages","checking on the animals"], a:1, e:"At first, I was only allowed to clean the cages."},
 {q:"How did things change after the first week?", o:["The staff gave the writer more responsibility.","The writer moved to a different centre.","The writer started working at night."], a:0, e:"the staff trusted me to help prepare food and check on the animals."},
 {q:"What was the best moment for the writer?", o:["meeting the other volunteers","seeing a seal return to the sea","finishing work early"], a:1, e:"A young seal ... was finally returned to the sea."},
 {q:"What does the writer think of volunteering?", o:["It is too hard for young people.","It is a good experience to recommend to others.","It is only useful if you want to work with animals."], a:1, e:"I'd recommend volunteering to anyone."}
]},
{id:"r4-7", level:"pet", type:"article", title:"The Girl Who Built a Robot Arm", sub:"人物報導",
 text:`When fourteen-year-old Priya Sharma saw her younger brother struggling to hold a spoon after an accident, she decided to help. 'He'd hurt his arm badly, and I wanted to make something that could make his life easier,' she explains.

Priya had never built anything like it before, but she was determined. She watched online videos, borrowed books from the library, and spent every weekend for six months in her garage. Her first three designs didn't work at all. 'I nearly gave up,' she admits. 'But each mistake taught me something.'

Her fourth design, made from plastic and a small motor, finally worked. The arm allowed her brother to pick up light objects like cups and pencils. Priya entered it into a national science competition and won first prize.

Now, a university is helping her improve the design so that more children can use it. 'I just wanted to help my brother,' she says. 'I never expected all this.'`,
 questions:[
 {q:"Why did Priya start building the robot arm?", o:["for a school project","to help her injured brother","because she wanted to win a prize"], a:1, e:"He'd hurt his arm badly, and I wanted to make something that could make his life easier."},
 {q:"How did Priya learn what to do?", o:["Her teacher showed her.","She studied videos and books by herself.","She took a course at a university."], a:1, e:"She watched online videos, borrowed books from the library."},
 {q:"What happened with her first designs?", o:["They were very successful.","They didn't work, but she learned from them.","She sold them online."], a:1, e:"didn't work at all ... each mistake taught me something."},
 {q:"What could her brother do with the fourth design?", o:["pick up light things","ride a bike","write very quickly"], a:0, e:"pick up light objects like cups and pencils."},
 {q:"How does Priya feel about her success?", o:["She is surprised by it.","She thinks she deserves more.","She is disappointed."], a:0, e:"I never expected all this. 她沒想到會這樣，覺得很意外。"}
]},
{id:"r4-8", level:"pet", type:"article", title:"Street Food Around the World", sub:"文化介紹",
 text:`Street food is one of the best ways to discover a country's culture. It's usually cheap, quick and made in front of you, so you know it's fresh.

In Taiwan, night markets are famous for dishes such as oyster omelettes and bubble tea. In Mexico, people queue for tacos filled with meat, onions and spicy sauce. In Turkey, you can try simit, a round bread covered with seeds, which many people eat for breakfast.

However, travellers should be careful. Choose stalls that are busy with local people, because it usually means the food is good and freshly cooked. And if you can't eat certain foods, learn how to explain it in the local language before you go.

Some cities are now worried that street food might disappear because of new rules and rising rents. Others, like Singapore, have protected their food markets as an important part of their history.`,
 questions:[
 {q:"According to the writer, one advantage of street food is that...", o:["you can see it being cooked","it is always healthy","it is only sold at night"], a:0, e:"made in front of you 在你面前現做。"},
 {q:"What do many people in Turkey eat for breakfast?", o:["tacos","simit","oyster omelettes"], a:1, e:"simit ... which many people eat for breakfast."},
 {q:"Why should you choose busy stalls?", o:["They are cheaper.","The food is more likely to be good and fresh.","They sell more kinds of food."], a:1, e:"it usually means the food is good and freshly cooked."},
 {q:"What should people who can't eat certain foods do?", o:["avoid street food completely","learn to explain it in the local language","only eat at restaurants"], a:1, e:"learn how to explain it in the local language before you go."},
 {q:"What has Singapore done?", o:["It has closed its food markets.","It has protected its food markets.","It has made street food more expensive."], a:1, e:"Singapore has protected their food markets."}
]}
];

function isRiskyEmoji(s){            // Emoji 12 以後的新圖示，舊一點的 iPad / 電腦會顯示成方框
  return [...(s||'')].some(ch=>{
    const cp = ch.codePointAt(0);
    return (cp>=0x1FA70&&cp<=0x1FAFF)||(cp>=0x1F7E0&&cp<=0x1F7F0)||(cp>=0x1F6D5&&cp<=0x1F6D7)||
           (cp>=0x1F6DC&&cp<=0x1F6DF)||(cp>=0x1F6FA&&cp<=0x1F6FC)||(cp>=0x1F90C&&cp<=0x1F90F)||
           cp===0x1F93F||cp===0x1F971||cp===0x1F972||cp===0x1F977||cp===0x1F978||cp===0x1F97B||
           (cp>=0x1F9A3&&cp<=0x1F9AF)||(cp>=0x1F9BA&&cp<=0x1F9BF)||(cp>=0x1F9C3&&cp<=0x1F9CF);
  });
}
(function applyAssoc(){
  const map = {};
  ASSOC_SRC.split(/\s+/).forEach(tok=>{
    const i = tok.indexOf('=');
    if(i<1) return;
    let v = tok.slice(i+1), force = false;
    if(v.endsWith('*')){ force = true; v = v.slice(0,-1); }
    map[tok.slice(0,i)] = {v, force};
  });
  const catIcon = {}; CATEGORIES.forEach(c=>catIcon[c.id]=c.icon);
  WORDS.forEach(w=>{
    const a = map[w.id] || map[w.word];
    if(a && a.v && !isRiskyEmoji(a.v)){ w.emoji = a.v; if(a.force) w.mode = 'meaning'; }
    if(!w.swatch && isRiskyEmoji(w.emoji)) w.emoji = catIcon[w.category] || '📖';
  });
  // 重新檢查看圖題：同一張圖只能對應一個答案（前面關卡優先）
  const used = new Map();
  WORDS.forEach(w=>{
    if(w.mode==='meaning') return;
    const v = w.swatch || w.emoji;
    if(used.has(v) && used.get(v)!==w.word){ w.mode = 'meaning'; return; }
    used.set(v, w.word);
  });
})();

/* =========================================================
   儲存系統：多位孩子，每人一份獨立存檔
   1. window.storage  → 在 Claude 內開啟時使用
   2. localStorage    → 下載到電腦/平板用瀏覽器開啟時使用
   3. 記憶體          → 兩者都不可用時（請用「存檔碼」備份）
   舊版的單人存檔會自動轉成第一位勇者，進度不會遺失
========================================================= */
const INDEX_KEY = 'spelling-rpg-profiles';
const OLD_KEY   = 'spelling-rpg-save-v2';
const pkey = id => 'spelling-rpg-p-' + id;
const MEM = {};
let INDEX = {profiles:[], last:null};
let DATA = null, CURRENT = null;
let storageMode = 'memory';        // 'cloud' | 'browser' | 'memory'
let storageLabel = '未啟用自動存檔';
let lastSavedAt = null;
let saveFailed = false;

const AVATARS = ['🧒','👦','👧','🧑','🦸','🧙','🐱','🐶','🦊','🐼'];

const DEFAULT_DATA = ()=>({
  version:3, name:'', avatar:'🧒', startLevel:'starters',
  coins:0, unlocked:['colors'], kingdomStars:{}, progress:{}, mistakeLog:[],
  gprog:{},            // 文法題紀錄 {題目id:{a:作答次數,c:答對次數,lastOk}}
  rprog:{},            // 閱讀紀錄   {文章id:{best,total,attempts}}
  accent:'US', voice:{US:'',UK:''}, rate:0.9, roundSize:10, focusChapter:'starters',
  lastCategory:null, lastPlayedDate:null, streakDays:0, totalSessions:0
});
function fillDefaults(d){ const def=DEFAULT_DATA(); for(const k in def){ if(!(k in d)) d[k]=def[k]; } return d; }

async function detectStorage(){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      await window.storage.set('__probe__','1',false);
      await window.storage.get('__probe__',false);
      storageMode='cloud'; storageLabel='自動存檔已開啟（Claude）';
      return;
    }
  }catch(e){ /* 往下一層 */ }
  try{
    window.localStorage.setItem('__probe__','1');
    if(window.localStorage.getItem('__probe__')==='1'){
      window.localStorage.removeItem('__probe__');
      storageMode='browser'; storageLabel='自動存檔已開啟（本機瀏覽器）';
      return;
    }
  }catch(e){ /* 往下一層 */ }
  storageMode='memory'; storageLabel='無法自動存檔，請用「存檔碼」備份';
}

async function rawGet(k){
  try{
    if(storageMode==='cloud'){ const r = await window.storage.get(k,false); return (r && r.value!=null) ? r.value : null; }
    if(storageMode==='browser') return window.localStorage.getItem(k);
  }catch(e){ return null; }
  return (k in MEM) ? MEM[k] : null;
}
async function rawSet(k, v){
  MEM[k] = v;
  if(storageMode==='cloud') await window.storage.set(k, v, false);
  else if(storageMode==='browser') window.localStorage.setItem(k, v);
}
async function rawDel(k){
  delete MEM[k];
  try{
    if(storageMode==='cloud') await window.storage.delete(k, false);
    else if(storageMode==='browser') window.localStorage.removeItem(k);
  }catch(e){}
}

function newId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function quickStats(d){
  let seen=0, mastered=0;
  for(const k in (d.progress||{})){
    const p = d.progress[k];
    if(p && p.attempts>0){ seen++; if((p.correctStreak||0)>=3) mastered++; }
  }
  return {seen, mastered};
}
function summaryOf(id, d){
  const s = quickStats(d);
  return {id, name:d.name||'勇者', avatar:d.avatar||'🧒', level:d.focusChapter||'starters',
          seen:s.seen, mastered:s.mastered, streak:d.streakDays||0, last:d.lastPlayedDate||null};
}
async function saveIndex(){ try{ await rawSet(INDEX_KEY, JSON.stringify(INDEX)); }catch(e){ saveFailed=true; } }

async function loadIndex(){
  const raw = await rawGet(INDEX_KEY);
  try{ INDEX = raw ? JSON.parse(raw) : {profiles:[], last:null}; }catch(e){ INDEX = {profiles:[], last:null}; }
  if(!INDEX || typeof INDEX!=='object') INDEX = {profiles:[], last:null};
  if(!Array.isArray(INDEX.profiles)) INDEX.profiles = [];
  if(INDEX.profiles.length===0){                  // 舊版單人存檔 → 自動轉成第一位勇者
    const old = await rawGet(OLD_KEY);
    if(old){
      try{
        const d = fillDefaults(JSON.parse(old));
        d.name = d.name || '勇者1';
        const id = newId();
        await rawSet(pkey(id), JSON.stringify(d));
        INDEX.profiles.push(summaryOf(id, d));
        INDEX.last = id;
        await saveIndex();
      }catch(e){}
    }
  }
}

async function openProfile(id){
  const raw = await rawGet(pkey(id));
  let d = null;
  try{ d = raw ? JSON.parse(raw) : null; }catch(e){}
  if(!d){
    const s = INDEX.profiles.find(p=>p.id===id);
    d = DEFAULT_DATA();
    if(s){ d.name = s.name; d.avatar = s.avatar; }
  }
  DATA = fillDefaults(d);
  CURRENT = id;
  INDEX.last = id;
  // 「今天選的級數」如果還沒解鎖（例如之前全部開放時選過），改回已開放的最高級數
  if(!chapterUnlocked(DATA.focusChapter)) DATA.focusChapter = highestUnlocked();
  await saveIndex();
}

async function writeNow(){
  if(!DATA || !CURRENT) return;
  try{
    await rawSet(pkey(CURRENT), JSON.stringify(DATA));
    lastSavedAt = Date.now();
    saveFailed = (storageMode==='memory');
  }catch(e){ saveFailed = true; }
  const i = INDEX.profiles.findIndex(p=>p.id===CURRENT);
  if(i>=0){ INDEX.profiles[i] = summaryOf(CURRENT, DATA); await saveIndex(); }
}
let saveTimer = null;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeNow, 150);
}
// 關閉分頁/切到背景時強制寫入，避免最後一題沒存到
window.addEventListener('pagehide', ()=>{ clearTimeout(saveTimer); writeNow(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ clearTimeout(saveTimer); writeNow(); }
});

/* ---------- 勇者（孩子）管理 ---------- */
// 從較高關卡開始時：前面的關卡整關開放（可複習），選的那一關開放第一個王國
function initialUnlocks(level){
  const li = CHAPTERS.findIndex(c=>c.id===level);
  const out = [];
  CHAPTERS.forEach((ch,i)=>{
    const cats = CATEGORIES.filter(c=>c.chapter===ch.id);
    if(i<li) cats.forEach(c=>out.push(c.id));
    else if(i===li && cats[0]) out.push(cats[0].id);
  });
  return out.length ? out : ['colors'];
}
async function createProfile(name, avatar, level){
  const id = newId();
  const d = DEFAULT_DATA();
  Object.assign(d, {name, avatar, startLevel:level, focusChapter:level, unlocked:initialUnlocks(level)});
  try{ await rawSet(pkey(id), JSON.stringify(d)); }catch(e){ saveFailed = true; }
  INDEX.profiles.push(summaryOf(id, d));
  await saveIndex();
  await openProfile(id);
}
async function deleteProfile(id){
  await rawDel(pkey(id));
  INDEX.profiles = INDEX.profiles.filter(p=>p.id!==id);
  if(INDEX.last===id) INDEX.last = null;
  await saveIndex();
  if(CURRENT===id){ CURRENT = null; DATA = null; }
}
// 清除某位孩子的紀錄：保留名字、頭像、起始關卡與個人設定
async function resetProfile(id){
  const raw = await rawGet(pkey(id));
  let old = {};
  try{ old = raw ? JSON.parse(raw) : {}; }catch(e){}
  const s = INDEX.profiles.find(p=>p.id===id) || {};
  const level = old.startLevel || 'starters';
  const d = DEFAULT_DATA();
  Object.assign(d, {name:old.name||s.name||'勇者', avatar:old.avatar||s.avatar||'🧒', startLevel:level,
                    focusChapter:level, unlocked:initialUnlocks(level),
                    accent:old.accent||'US', roundSize:old.roundSize||10});
  try{ await rawSet(pkey(id), JSON.stringify(d)); }catch(e){}
  const i = INDEX.profiles.findIndex(p=>p.id===id);
  if(i>=0) INDEX.profiles[i] = summaryOf(id, d);
  await saveIndex();
  if(CURRENT===id) DATA = d;
}
async function renameProfile(id, name){
  if(CURRENT===id && DATA){ DATA.name = name; await writeNow(); return; }
  const raw = await rawGet(pkey(id));
  let d = null;
  try{ d = raw ? JSON.parse(raw) : null; }catch(e){}
  d = fillDefaults(d || DEFAULT_DATA());
  d.name = name;
  try{ await rawSet(pkey(id), JSON.stringify(d)); }catch(e){}
  const i = INDEX.profiles.findIndex(p=>p.id===id);
  if(i>=0) INDEX.profiles[i] = summaryOf(id, d);
  await saveIndex();
}

function toB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin=''; bytes.forEach(b=> bin += String.fromCharCode(b));
  return btoa(bin);
}
function fromB64(b64){
  const bin = atob(b64.replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function exportSaveCode(){ return toB64(JSON.stringify(DATA)); }
function importSaveCode(code){
  const obj = JSON.parse(fromB64(code));
  if(!obj || typeof obj!=='object' || !('progress' in obj)) throw new Error('格式不符');
  const keepName = DATA ? DATA.name : '', keepAv = DATA ? DATA.avatar : '🧒';
  DATA = fillDefaults(obj);
  if(!DATA.name) DATA.name = keepName;
  if(!DATA.avatar) DATA.avatar = keepAv;
  writeNow();
}
function downloadSaveFile(){
  try{
    const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `拼字勇者_${DATA.name||'存檔'}_${todayStr()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    return true;
  }catch(e){ return false; }
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(dateStr, n){
  const [y,m,dd] = dateStr.split('-').map(Number);
  const d = new Date(y, m-1, dd);
  d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  if(a.join('')===arr.join('') && a.length>1){ [a[0],a[1]]=[a[1],a[0]]; }
  return a;
}
function getProgress(wordId){
  if(!DATA.progress[wordId]){
    DATA.progress[wordId] = {attempts:0, correct:0, correctStreak:0, wrongStreakDays:0,
      lastWrongDate:null, lastCorrectDate:null, dueDate:todayStr()};
  }
  return DATA.progress[wordId];
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   自訂對話框：取代瀏覽器內建的 alert / confirm / prompt
   （iPad 上內建對話框很小，而且在內嵌網頁裡可能被直接擋掉）
   全部回傳 Promise：  await UI.confirm('...')  → true / false
========================================================= */
let modalOpen = false;
const UI = {
  _show(opts){
    return new Promise(resolve=>{
      const old = document.getElementById('ui-modal');
      if(old && old.remove) old.remove();
      const el = document.createElement('div');
      el.id = 'ui-modal';
      el.className = 'ui-back';
      let body = `<div class="ui-msg">${esc(opts.msg).replace(/\n/g,'<br>')}</div>`;
      if(opts.input) body += `<input id="ui-input" class="np-input" maxlength="${opts.maxlength||12}" value="${esc(opts.value||'')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
      if(opts.list){
        let g = null;
        body += '<div class="ui-list">' + opts.list.map((it,i)=>{
          const head = (it.group && it.group!==g) ? (g=it.group, `<div class="ui-grp">${esc(it.group)}</div>`) : '';
          return head + `<button class="ui-item" data-pick="${i}">${esc(it.label)}</button>`;
        }).join('') + '</div>';
      }
      body += '<div class="ui-btns">' + opts.buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-btn="${i}">${esc(b.label)}</button>`).join('') + '</div>';
      el.innerHTML = `<div class="ui-box" role="dialog" aria-modal="true">${body}</div>`;
      document.body.appendChild(el);
      modalOpen = true;
      let finished = false;
      const finish = v=>{
        if(finished) return; finished = true;
        modalOpen = false;
        document.removeEventListener('keydown', onKey, true);
        if(el.remove) el.remove();
        resolve(v);
      };
      const valueOf = i=>{
        const b = opts.buttons[i];
        if(b.value==='__input__') return document.getElementById('ui-input').value;
        return b.value;
      };
      function onKey(e){
        if(e.key==='Escape'){ e.stopPropagation(); finish(opts.cancelValue); }
        else if(e.key==='Enter' && opts.input){ e.preventDefault(); e.stopPropagation(); finish(document.getElementById('ui-input').value); }
      }
      document.addEventListener('keydown', onKey, true);
      el.addEventListener('click', ev=>{
        const t = ev.target;
        if(t === el){ if(opts.dismissable!==false) finish(opts.cancelValue); return; }
        const btn = t.closest && t.closest('[data-btn]');
        if(btn){ finish(valueOf(+btn.getAttribute('data-btn'))); return; }
        const pick = t.closest && t.closest('[data-pick]');
        if(pick) finish(opts.list[+pick.getAttribute('data-pick')].value);
      });
      const inp = document.getElementById('ui-input');
      if(inp && inp.focus){ inp.focus(); if(inp.select) inp.select(); }
    });
  },
  alert(msg){
    return UI._show({msg, buttons:[{label:'好', value:true}], cancelValue:true});
  },
  confirm(msg, yes, no){
    return UI._show({msg, buttons:[{label:no||'取消', value:false, cls:'secondary'}, {label:yes||'確定', value:true}], cancelValue:false});
  },
  prompt(msg, value, maxlength){
    return UI._show({msg, input:true, value, maxlength,
      buttons:[{label:'取消', value:null, cls:'secondary'}, {label:'確定', value:'__input__'}], cancelValue:null});
  },
  choose(msg, list){
    return UI._show({msg, list, buttons:[{label:'取消', value:null, cls:'secondary'}], cancelValue:null});
  }
};

/* ---------- iPad / iOS 輔助 ---------- */
function isIOSDevice(){
  const n = (typeof navigator!=='undefined') ? navigator : {};
  return /iPad|iPhone|iPod/.test(n.userAgent||'') || (n.platform==='MacIntel' && n.maxTouchPoints>1);
}
function isStandaloneApp(){
  try{
    if(typeof navigator!=='undefined' && navigator.standalone===true) return true;
    return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }catch(e){ return false; }
}
function showInstallTip(){ return isIOSDevice() && !isStandaloneApp() && !(INDEX && INDEX.tipHidden); }

  if(!hasTTS) return;
  try{ const s = window.speechSynthesis; if(s.speaking || s.pending) s.cancel(); }catch(e){}

  const before = voicesCache.length;

  try{ if(!before && voicesCache.length && state.screen==='settings') render(true); }catch(e){}
}

  try{ window.speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){}

const GOOD_VOICES = {
  US:['Samantha','Ava','Allison','Susan','Zoe','Nicky','Joelle','Evan','Tom','Alex','Aaron','Google US English','Microsoft Aria','Microsoft Jenny'],
  UK:['Daniel','Serena','Kate','Martha','Arthur','Oliver','Stephanie','Google UK English Female','Google UK English Male','Microsoft Sonia','Microsoft Libby']
};
function voiceScore(v, accent){
  const want = accent==='UK' ? 'en-gb' : 'en-us';
  const vl = (v.lang||'').replace('_','-').toLowerCase();
  if(!vl.startsWith('en')) return -1;
  let s = (vl===want) ? 40 : 5;
  if(NOVELTY_VOICE.test(v.name||'')) s -= 100;
  if(/premium|高品質|優質/i.test(v.name)) s += 30;
  else if(/enhanced|neural|natural|加強/i.test(v.name)) s += 25;
  else if(/siri/i.test(v.name)) s += 20;
  const i = GOOD_VOICES[accent].findIndex(n=>(v.name||'').includes(n));
  if(i>=0) s += 15 - i*0.5;
  if(v.localService) s += 2;
  return s;
}
function englishVoices(accent){
  if(!voicesCache.length) refreshVoices();
  return voicesCache.filter(v=>voiceScore(v,accent)>0).sort((a,b)=>voiceScore(b,accent)-voiceScore(a,accent));
}
function pickVoice(accent){
  const chosen = DATA && DATA.voice && DATA.voice[accent];
  if(chosen){ const v = voicesCache.find(x=>x.name===chosen); if(v) return v; }
  return englishVoices(accent)[0] || null;
}
let unlockAt = 0;
function speakOut(text, rate){
  if(!hasTTS || !text) return;
  const s = window.speechSynthesis;
  if(Date.now() - unlockAt > 600) ttsCancel();   // 剛做完 iOS 語音解鎖時不要立刻取消，否則第一個字會被吞掉
  try{ s.resume(); }catch(e){}                   // iPad 從背景回來時，語音有時會卡在「暫停」
  const u = new SpeechSynthesisUtterance(text);
  const accent = (DATA && DATA.accent) || 'US';
  u.lang = accent==='UK' ? 'en-GB' : 'en-US';
  const v = pickVoice(accent);
  if(v){ u.voice = v; if(v.lang) u.lang = v.lang; }
  u.rate = rate || (DATA && DATA.rate) || 0.9;
  u.pitch = 1;
  window.__lastUtterance = u;                    // 保留參照，避免 Safari 念到一半把語音物件回收
  s.speak(u);
}
function speakWord(word){ speakOut(word); }

/* =========================================================
   拼字錯誤型態分析
========================================================= */
function diffMistake(correct, typed){
  correct = correct.toLowerCase(); typed = (typed||'').toLowerCase();
  const patterns = [];
  if(typed.length < correct.length){
    patterns.push({type:'missing_letter', detail:'漏掉了字母'});
  } else if(typed.length > correct.length){
    patterns.push({type:'extra_letter', detail:'多打了字母'});
  } else {
    let diffPos=[];
    for(let i=0;i<correct.length;i++){ if(correct[i]!==typed[i]) diffPos.push(i); }
    if(diffPos.length===2 && diffPos[1]-diffPos[0]===1 &&
       correct[diffPos[0]]===typed[diffPos[1]] && correct[diffPos[1]]===typed[diffPos[0]]){
      patterns.push({type:'transposition', detail:'字母順序顛倒了'});
    } else {
      diffPos.forEach(i=>{
        patterns.push({type:'letter_confusion', detail:`把 "${correct[i]}" 拼成了 "${typed[i]}"`, pair:correct[i]+'→'+typed[i]});
      });
    }
  }
  if(/(.)\1/.test(correct)){
    const m = correct.match(/(.)\1/);
    if(!typed.includes(m[0])){
      patterns.push({type:'double_letter', detail:`忘記重複字母 "${m[1]}${m[1]}"`});
    }
  }
  return patterns;
}

function analyzeWeaknesses(){
  const catStats = {}; CATEGORIES.forEach(c=>catStats[c.id]={attempts:0,correct:0});
  const wordStats = [];
  for(const w of WORDS){
    const p = DATA.progress[w.id];
    if(p && p.attempts>0){
      catStats[w.category].attempts += p.attempts;
      catStats[w.category].correct += p.correct;
      wordStats.push({...w, accuracy: p.correct/p.attempts, attempts:p.attempts});
    }
  }
  const weakCats = CATEGORIES
    .map(c=>({...c, acc: catStats[c.id].attempts? catStats[c.id].correct/catStats[c.id].attempts : null, attempts:catStats[c.id].attempts}))
    .filter(c=>c.attempts>=3)
    .sort((a,b)=>a.acc-b.acc);
  const weakWords = wordStats.filter(w=>w.attempts>=1).sort((a,b)=>a.accuracy-b.accuracy).slice(0,5);

  const patternCount = {};
  (DATA.mistakeLog||[]).forEach(m=>{
    diffMistake(m.correct, m.typed).forEach(p=>{
      const key = p.type + (p.pair? (':'+p.pair):'');
      patternCount[key] = patternCount[key] || {count:0, sample:p.detail};
      patternCount[key].count++;
    });
  });
  const topPatterns = Object.entries(patternCount).sort((a,b)=>b[1].count-a[1].count).slice(0,4);

  const dueCount = dueWords().length;
  const totalAttempts = wordStats.reduce((s,w)=>s+w.attempts,0);
  const totalCorrect = WORDS.reduce((s,w)=> s + (DATA.progress[w.id]? DATA.progress[w.id].correct:0), 0);
  const seen = wordStats.length;
  const mastered = WORDS.filter(w=>{ const p=DATA.progress[w.id]; return p && (p.correctStreak||0)>=3; }).length;

  return {weakCats, weakWords, topPatterns, dueCount, totalAttempts, totalCorrect, seen, mastered};
}

/* ---------- 王國進度統計 ---------- */
function kingdomStats(catId){
  const words = WORDS.filter(w=>w.category===catId);
  let seen=0, mastered=0;
  words.forEach(w=>{
    const p = DATA.progress[w.id];
    if(p && p.attempts>0){ seen++; if((p.correctStreak||0)>=3) mastered++; }
  });
  const pct = words.length ? Math.round(mastered/words.length*100) : 0;
  let stars = 0;
  if(pct>=100) stars=3; else if(pct>=60) stars=2; else if(pct>=30) stars=1;
  return {total:words.length, seen, mastered, pct, stars};
}
// 級數（第一～四關）要依序解鎖；已開放的級數裡，所有單字王國都可以自由選擇有興趣的主題
function isUnlocked(catId){ const c = CAT_MAP[catId]; return c ? chapterUnlocked(c.chapter) : false; }

/* ---------- 關卡（第一關～第四關） ---------- */
const LEVEL_REQ = 50;                    // 上一關單字精熟達 50% 自動開啟下一關
const READING_LEVELS = ['flyers','pet'];  // 有閱讀測驗的關卡
const CAT_MAP = {}; CATEGORIES.forEach(c=>CAT_MAP[c.id]=c);

function chapterOf(w){ const c = CAT_MAP[w.category]; return c ? c.chapter : null; }
function chapterCats(chapId){ return CATEGORIES.filter(c=>c.chapter===chapId); }
function chapterInfo(chapId){ return CHAPTERS.find(c=>c.id===chapId) || CHAPTERS[0]; }
function chapterIndex(chapId){ return CHAPTERS.findIndex(c=>c.id===chapId); }
function chapterStats(chapId){
  let total=0, seen=0, mastered=0;
  for(const w of WORDS){
    if(chapterOf(w)!==chapId) continue;
    total++;
    const p = DATA.progress[w.id];
    if(p && p.attempts>0){ seen++; if((p.correctStreak||0)>=3) mastered++; }
  }
  return {total, seen, mastered, pct: total ? Math.round(mastered/total*100) : 0};
}
function chapterUnlocked(chapId){
  if(chapId==='starters') return true;
  return !!DATA && chapterCats(chapId).some(c=>DATA.unlocked.includes(c.id));
}
function highestUnlocked(){
  let h = 'starters';
  CHAPTERS.forEach(c=>{ if(chapterUnlocked(c.id)) h = c.id; });
  return h;
}
// 上一關練到門檻就自動開啟下一關；回傳剛解鎖的關卡 id（沒有則回傳 null）
function maybeUnlockNextLevel(){
  for(let i=0;i<CHAPTERS.length-1;i++){
    const cur = CHAPTERS[i].id, nxt = CHAPTERS[i+1].id;
    if(chapterUnlocked(cur) && !chapterUnlocked(nxt) && chapterStats(cur).pct>=LEVEL_REQ){
      const first = chapterCats(nxt)[0];
      if(first){ DATA.unlocked.push(first.id); return nxt; }
    }
  }
  return null;
}
function unlockChapter(chapId){
  chapterCats(chapId).forEach(c=>{ if(!DATA.unlocked.includes(c.id)) DATA.unlocked.push(c.id); });
  writeNow();
}
// 只在同一關卡內往下解鎖
function unlockNextIn(catId){
  const cat = CAT_MAP[catId];
  if(!cat) return;
  const sibs = chapterCats(cat.chapter);
  const i = sibs.findIndex(c=>c.id===catId);
  if(i>=0 && i+1<sibs.length){
    const nid = sibs[i+1].id;
    if(!DATA.unlocked.includes(nid)) DATA.unlocked.push(nid);
  }
}

/* ---------- 今天該複習的單字 ---------- */
function dueWords(catId){
  const today = todayStr();
  return WORDS.filter(w=>{
    if(catId && w.category!==catId) return false;
    if(!catId && !isUnlocked(w.category)) return false;
    const p = DATA.progress[w.id];
    return p && p.attempts>0 && p.dueDate <= today;
  }).sort((a,b)=>{
    const pa=DATA.progress[a.id], pb=DATA.progress[b.id];
    // 連續答錯天數多的優先，其次到期日早的優先，其次正確率低的優先
    const ws = (pb.wrongStreakDays||0)-(pa.wrongStreakDays||0);
    if(ws!==0) return ws;
    if(pa.dueDate!==pb.dueDate) return pa.dueDate < pb.dueDate ? -1 : 1;
    return (pa.correct/pa.attempts)-(pb.correct/pb.attempts);
  });
}

/* =========================================================
   出題：王國模式 / 今日任務模式
========================================================= */
function planQueue(list){
  const size = DATA.roundSize || 10;
  return list.slice(0, size);
}
// 複習題佔比會自動調整：待複習積太多時多排複習，追上進度後再多給新字
function reviewCap(){
  const size = DATA.roundSize || 10;
  const backlog = dueWords().length;
  let ratio = 0.6;                               // 平常 6 成複習、4 成新字
  if(backlog >= size*3)      ratio = 0.9;        // 積很多 → 幾乎全部拿來複習
  else if(backlog >= size*2) ratio = 0.8;
  else if(backlog === 0)     ratio = 0;          // 全部複習完 → 整回合都學新字
  return Math.ceil(size*ratio);
}

// 王國模式：到期複習（最多 60%）→ 沒學過的新字 → 其餘複習 → 練得最少的字
function enterKingdom(catId){
  const words = WORDS.filter(w=>w.category===catId);
  const size = DATA.roundSize || 10;
  const due = dueWords(catId);
  const dueIds = new Set(due.map(w=>w.id));
  const fresh = shuffle(words.filter(w=>{
    const p = DATA.progress[w.id];
    return !p || p.attempts===0;
  }));
  const rest = words
    .filter(w=>!dueIds.has(w.id) && DATA.progress[w.id] && DATA.progress[w.id].attempts>0)
    .sort((a,b)=> DATA.progress[a.id].attempts - DATA.progress[b.id].attempts);

  let queue = due.slice(0, reviewCap());
  for(const w of fresh){ if(queue.length>=size) break; queue.push(w); }        // 新字優先補滿
  for(const w of due.slice(reviewCap())){ if(queue.length>=size) break; queue.push(w); }
  for(const w of rest){ if(queue.length>=size) break; queue.push(w); }

  DATA.lastCategory = catId;
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(cat) DATA.focusChapter = cat.chapter;
  startSession(shuffle(queue), 'kingdom', catId);
}

// 今日任務：跨所有已解鎖王國，複習優先，再從「學得最少的王國」平均補新字
function startDailyQuest(){
  const size = DATA.roundSize || 10;
  const due = dueWords();                  // 複習題永遠橫跨全部學過的字（間隔重複的正確作法）
  let queue = due.slice(0, reviewCap());   // 複習題最多佔 60%，其餘留給新字
  // 新字只從「目前主攻的章節」挑，避免解鎖第二部後還一直被第一部占滿
  const focus = chapterUnlocked(DATA.focusChapter||'starters') ? (DATA.focusChapter||'starters') : 'starters';

  if(queue.length < size){
    const chosen = new Set(queue.map(w=>w.id));
    // 依「精熟比例低」排序王國，輪流各取一個新字 → 確保每個單元都會被練到
    let cats = CATEGORIES.filter(c=>isUnlocked(c.id) && c.chapter===focus)
      .map(c=>({id:c.id, pct:kingdomStats(c.id).pct}))
      .sort((a,b)=>a.pct-b.pct);
    // 主攻章節的新字用完了，才回頭補其他章節
    if(!cats.length || !CATEGORIES.some(c=>c.chapter===focus && isUnlocked(c.id) &&
        WORDS.some(w=>w.category===c.id && !chosen.has(w.id) && (!DATA.progress[w.id]||DATA.progress[w.id].attempts===0)))){
      cats = CATEGORIES.filter(c=>isUnlocked(c.id))
        .map(c=>({id:c.id, pct:kingdomStats(c.id).pct}))
        .sort((a,b)=>a.pct-b.pct);
    }
    const pools = {};
    cats.forEach(c=>{
      pools[c.id] = shuffle(WORDS.filter(w=>{
        if(w.category!==c.id || chosen.has(w.id)) return false;
        const p = DATA.progress[w.id];
        return !p || p.attempts===0;
      }));
    });
    let added = true;
    while(queue.length < size && added){
      added = false;
      for(const c of cats){
        if(queue.length >= size) break;
        const pool = pools[c.id];
        if(pool && pool.length){ queue.push(pool.shift()); added = true; }
      }
    }
  }
  // 新字不夠時，把剩下的到期複習題補回來
  if(queue.length < size){
    const chosen = new Set(queue.map(w=>w.id));
    for(const w of due){
      if(queue.length>=size) break;
      if(!chosen.has(w.id)){ queue.push(w); chosen.add(w.id); }
    }
  }
  // 還是不夠（全部學過且都沒到期）→ 補練得最少的字
  if(queue.length < size){
    const chosen = new Set(queue.map(w=>w.id));
    const rest = WORDS.filter(w=>isUnlocked(w.category) && !chosen.has(w.id))
      .sort((a,b)=>{
        const pa=DATA.progress[a.id], pb=DATA.progress[b.id];
        return (pa?pa.attempts:0)-(pb?pb.attempts:0);
      });
    queue = queue.concat(rest.slice(0, size-queue.length));
  }
  startSession(shuffle(queue), 'daily', null);
}

// 弱點特訓：只練正確率最低的字
function startWeakDrill(){
  const list = WORDS
    .map(w=>({w, p:DATA.progress[w.id]}))
    .filter(x=>x.p && x.p.attempts>0 && x.p.correct/x.p.attempts < 1 && isUnlocked(x.w.category))
    .sort((a,b)=>(a.p.correct/a.p.attempts)-(b.p.correct/b.p.attempts))
    .map(x=>x.w);
  if(list.length===0){ UI.alert('太厲害了！目前沒有答錯過的單字，先去挑戰新王國吧 🎉'); return; }
  startSession(planQueue(list), 'weak', null);
}

function startSession(queue, mode, catId){

  state.currentCategory = catId;

  state.queueTotal = queue.length;
  state.sessionPlanned = queue.length;
  state.requeuedToday = {};
  state.sessionMistakes = 0;
  state.sessionCorrectFirstTry = 0;
  state.sessionWordsSeen = 0;

}

function nextWord(){
  if(state.queue.length===0){ finishSession(); return; }
  const w = state.queue.shift();

  state.attemptsThisWord = 0;
  state.clueMode = w.mode ? w.mode : (Math.random()<0.5 ? 'image':'meaning');
  state.scrambled = shuffle(w.word.split(''));
  state.monsterHP = 100;
  state.screen = 'battle';
  render();
}

// 字母磚／空格一行放不下時，平均分成兩行（例如 13 個字母 → 7 + 6），避免「7 + 1」最後一個字母落單
function balanceRows(){
  try{
    const w = state.currentWord;
    const tiles = document.getElementById('tiles-box'), blanks = document.getElementById('blanks-box');
    if(!w || !tiles || !blanks || !tiles.clientWidth) return;
    const L = w.word.length;
    [tiles, blanks].forEach(b=>{ b.style.maxWidth=''; b.style.marginLeft='auto'; b.style.marginRight='auto'; });
    const gapOf = el=>{ const cs = getComputedStyle(el); return parseFloat(cs.columnGap) || parseFloat(cs.gap) || 8; };
    const t0 = tiles.firstElementChild; if(!t0) return;
    const tw = t0.getBoundingClientRect().width, tg = gapOf(tiles);
    const cols = Math.max(1, Math.floor((tiles.clientWidth + tg) / (tw + tg)));
    if(cols >= L) return;                                   // 一行放得下就不用分
    const rows = Math.ceil(L/cols), per = Math.ceil(L/rows);
    [tiles, blanks].forEach(b=>{
      const it = b.firstElementChild; if(!it) return;
      b.style.maxWidth = (per*it.getBoundingClientRect().width + (per-1)*gapOf(b) + 1) + 'px';
    });
  }catch(e){}
}
// iPad 轉向（直放 ⇄ 橫放）時重新計算
window.addEventListener('resize', ()=>{
  clearTimeout(balanceRows._t);
  balanceRows._t = setTimeout(()=>{ if(state.screen==='battle') balanceRows(); }, 120);
});

async function quitSession(){

    ttsCancel();

// 點字母時只更新那一格，不重畫整個畫面（iPad Safari 整頁重畫會讓畫面跳一下）
function syncBattleTiles(){
  const w = state.currentWord;
  if(!w) return;
  for(let i=0;i<w.word.length;i++){
    const b = document.getElementById('blank-'+i);
    if(!b) continue;
    const ch = state.currentAttempt[i];
    b.textContent = ch ? ch.toUpperCase() : '';
    b.classList.remove('wrong-flash'); b.classList.remove('reveal');
  }
  state.scrambled.forEach((ch,i)=>{
    const t = document.getElementById('tile-'+i);
    if(!t) return;
    t.disabled = state.usedTileIdx.includes(i);
    t.classList.remove('wrong-shake');
  });
}
function tapTile(i){
  if(state.usedTileIdx.includes(i)) return;
  const w = state.currentWord;
  if(state.currentAttempt.length >= w.word.length) return;
  state.currentAttempt.push(state.scrambled[i]);
  state.usedTileIdx.push(i);
  syncBattleTiles();
  if(state.currentAttempt.length === w.word.length) setTimeout(checkAnswer, 150);
}
function undoTile(){
  if(state.currentAttempt.length===0) return;
  // 字母已經填滿、正在判斷答案時不能再清除，否則會被誤判成答錯
  if(state.currentWord && state.currentAttempt.length >= state.currentWord.word.length) return;
  state.currentAttempt.pop();
  state.usedTileIdx.pop();
  syncBattleTiles();
}
function hintLetter(){
  const w = state.currentWord;
  const nextIdx = state.currentAttempt.length;
  if(nextIdx >= w.word.length) return;
  const correctLetter = w.word[nextIdx];
  const tileIdx = state.scrambled.findIndex((ch,i)=> ch===correctLetter && !state.usedTileIdx.includes(i));
  if(tileIdx>=0) tapTile(tileIdx);
}
function checkAnswer(){
  const w = state.currentWord;
  const typed = state.currentAttempt.join('');
  const correct = typed === w.word;
  state.attemptsThisWord++;
  state.sessionWordsSeen++;
  const fb = document.getElementById('feedback');
  const monster = document.getElementById('monster');

  if(correct){
    if(monster) monster.classList.add('hit');
    if(fb){ fb.className='feedback good'; fb.textContent='正確！太棒了 🎉'; }
    DATA.coins += 5;
    if(state.attemptsThisWord===1) state.sessionCorrectFirstTry++;
    setTimeout(()=>{ if(monster){ monster.classList.remove('hit'); monster.classList.add('defeat'); } }, 250);
    setTimeout(()=>{
      commitWordResult(w, state.attemptsThisWord===1);
      nextWord();
    }, 700);
  } else {
    state.sessionMistakes++;
    state.usedTileIdx.forEach(i=> document.getElementById('tile-'+i)?.classList.add('wrong-shake'));
    for(let i=0;i<w.word.length;i++) document.getElementById('blank-'+i)?.classList.add('wrong-flash');
    logMistake(w.word, typed);
    if(state.attemptsThisWord < 3){
      if(fb){ fb.className='feedback bad'; fb.textContent=`不對唷，再試一次！(${state.attemptsThisWord}/3)`; }
      setTimeout(()=>{ state.currentAttempt=[]; state.usedTileIdx=[]; syncBattleTiles(); }, 700);
    } else {
      if(fb){ fb.className='feedback bad'; fb.textContent=`正確答案是：${w.word.toUpperCase()}`; }
      for(let i=0;i<w.word.length;i++){
        const b=document.getElementById('blank-'+i);
        if(b){ b.classList.add('reveal'); b.textContent=w.word[i].toUpperCase(); }
      }
      speakWord(w.word);
      setTimeout(()=>{ commitWordResult(w, false); nextWord(); }, 1600);
    }
  }
}

function logMistake(correct, typed){
  DATA.mistakeLog = DATA.mistakeLog || [];
  DATA.mistakeLog.push({correct, typed, date:todayStr()});
  if(DATA.mistakeLog.length>120) DATA.mistakeLog = DATA.mistakeLog.slice(-120);
}

/* 間隔重複的複習間隔（天）：答對越多次，間隔拉得越長
   1次→1天　2次→3天　3次→7天(每週複習一次)　4次→14天　5次→30天　6次以上→60天
   若一直維持「每週一次」，單字量到 400 字時每天要複習 60 題，孩子永遠追不完，
   因此第 3 次之後改為逐步拉長，長期記憶效果也更好。 */
const REVIEW_STEPS = [1, 3, 7, 14, 30, 60];
function intervalFor(streak){
  return REVIEW_STEPS[Math.min(Math.max(streak,1), REVIEW_STEPS.length) - 1];
}

/* 間隔複習規則 + 每題即時存檔 */
function commitWordResult(w, firstTrySuccess){
  const p = getProgress(w.id);
  const today = todayStr();
  p.attempts++;
  if(firstTrySuccess) p.correct++;

  if(!firstTrySuccess){
    p.correctStreak = 0;
    if(p.lastWrongDate === addDays(today,-1)) p.wrongStreakDays = (p.wrongStreakDays||0)+1;
    else p.wrongStreakDays = 1;
    p.lastWrongDate = today;
    p.dueDate = addDays(today,1);              // 連續兩天答錯 → 隔天最優先（由排序處理）

    if(!state.requeuedToday[w.id]){            // 當天再出現 2 次
      state.requeuedToday[w.id] = true;
      state.queue.splice(Math.min(state.queue.length,2), 0, w);
      state.queue.splice(Math.min(state.queue.length,5), 0, w);
      state.queueTotal += 2;
    }
  } else {
    if(p.lastCorrectDate !== today){
      p.correctStreak = (p.correctStreak||0)+1;
      p.lastCorrectDate = today;
    }
    p.wrongStreakDays = 0;
    p.dueDate = addDays(today, intervalFor(p.correctStreak));  // 連三次答對後 → 每週複習一次，之後間隔再逐步拉長
  }
  saveData();   // ← 每一題都存，隨時關掉都不會丟進度
}

/* ---------- 回合結算 ---------- */
function finishSession(){
  const planned = state.sessionPlanned || 1;
  const rate = Math.min(1, state.sessionCorrectFirstTry / planned);
  let stars = 1;
  if(rate>=0.9) stars=3; else if(rate>=0.6) stars=2;

  DATA.coins += stars*10;
  DATA.totalSessions = (DATA.totalSessions||0)+1;

  markPlayedToday();   // 連續練習天數

  // 王國星等改以「精熟比例」計算，並解鎖下一個王國
  if(state.currentCategory){
    const s = kingdomStats(state.currentCategory);
    DATA.kingdomStars[state.currentCategory] = s.stars;
    unlockNextIn(state.currentCategory);
  } else {
    CATEGORIES.forEach(c=>{ if(isUnlocked(c.id) && kingdomStats(c.id).seen>0) unlockNextIn(c.id); });
  }
  const newLevel = maybeUnlockNextLevel();   // 上一關精熟 50% → 自動開啟下一關
  if(newLevel){ DATA.focusChapter=newLevel; state.chapterTab=newLevel; }
  writeNow();

  state._lastReport = {
    catId: state.currentCategory, mode: state.mode, stars, rate,
    mistakes: state.sessionMistakes, planned, newChapter: newLevel
  };
  state.screen='report';
  render();
}

/* =========================================================
   文法道場：重組句子 / 選擇題
========================================================= */
// 選項順序每次隨機（題庫裡正解多半寫在中間，不洗牌孩子會養成「猜 B」的習慣）
function shuffleFree(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function gLevelAcc(lv){
  let a=0, c=0, seen=0, total=0;
  GRAMMAR.forEach(q=>{
    if(q.level!==lv) return;
    total++;
    const p = DATA.gprog[q.id];
    if(p){ a+=p.a; c+=p.c; seen++; }
  });
  return {a, c, seen, total, acc: a ? Math.round(c/a*100) : null};
}
function gPoints(lv){
  const m = {};
  GRAMMAR.forEach(q=>{
    if(q.level!==lv) return;
    const s = m[q.g] || (m[q.g] = {g:q.g, total:0, seen:0, a:0, c:0});
    s.total++;
    const p = DATA.gprog[q.id];
    if(p){ s.seen++; s.a+=p.a; s.c+=p.c; }
  });
  return Object.values(m);
}
function grammarWeakPoints(){
  const m = {};
  GRAMMAR.forEach(q=>{
    const p = DATA.gprog[q.id];
    if(!p || !chapterUnlocked(q.level)) return;
    const k = q.level+'|'+q.g;
    const s = m[k] || (m[k] = {lv:q.level, g:q.g, a:0, c:0});
    s.a+=p.a; s.c+=p.c;
  });
  return Object.values(m).filter(s=>s.a>=2)
    .map(s=>({...s, acc:Math.round(s.c/s.a*100)}))
    .filter(s=>s.acc<80)
    .sort((x,y)=>x.acc-y.acc).slice(0,5);
}

function startGrammar(lv, type, pointIdx){
  const pt = (pointIdx!=null && state.hubPoints) ? state.hubPoints[pointIdx] : null;
  const pool = GRAMMAR.filter(q=>q.level===lv && (!type || q.t===type) && (!pt || q.g===pt.g));
  const label = pt ? pt.g : (type==='ro' ? '重組句子' : type==='mc' ? '選擇題' : '混合挑戰');
  startGrammarPool(pool, {level:lv, type, pointIdx, label});
}
function startGrammarWeak(){
  const pts = grammarWeakPoints();
  if(!pts.length) return;
  const keys = new Set(pts.map(p=>p.lv+'|'+p.g));
  startGrammarPool(GRAMMAR.filter(q=>keys.has(q.level+'|'+q.g)), {level:pts[0].lv, label:'弱點文法特訓', weak:true});
}
function startGrammarPool(pool, meta){
  if(!pool.length){ UI.alert('這裡還沒有題目喔！'); return; }
  // 出題優先順序：沒練過 → 上次答錯 → 正確率低（同分隨機），跟單字一樣自動加強弱項
  const pr = q=>{
    const p = DATA.gprog[q.id];
    if(!p) return Math.random();
    if(p.lastOk===false) return 1 + Math.random();
    return 2 + p.c/p.a + Math.random()*0.5;
  };
  const picked = pool.map(q=>({q, s:pr(q)})).sort((a,b)=>a.s-b.s).slice(0, DATA.roundSize||10).map(x=>x.q);
  state.g = {meta, queue:shuffle(picked), idx:0, correct:0, results:[]};
  resetGQ();
  state.screen = 'grammar';
  render();
}
function roTokens(s){
  const words = s.replace(/[.,!?]/g,'').split(/\s+/).filter(Boolean);
  if(words.length && words[0]!=='I' && !/^I'/.test(words[0])) words[0] = words[0].charAt(0).toLowerCase() + words[0].slice(1);
  return words;
}
function cap(w){ return w.charAt(0).toUpperCase() + w.slice(1); }
function resetGQ(){
  const G = state.g, q = G.queue[G.idx];
  G.answered=false; G.ok=null; G.second=false; G.choice=null; G.tries=0; G.flash='';
  if(q && q.t==='mc') G.perm = shuffleFree(q.o.map((_,i)=>i));
  if(q && q.t==='ro'){
    G.tokens = roTokens(q.s);
    G.tiles = shuffle(G.tokens.map((w,i)=>i));
    G.placed = [];
  }
}
function gFill(q){ return q.q.replace('___', q.o[q.a]); }
function gFullSentence(){
  const q = state.g.queue[state.g.idx];
  return (q.t==='mc' ? gFill(q) : q.s).replace(/\s*\(.*?\)/g,'').replace('— ','');
}
function renderGrammarQ(){
  const G = state.g, q = G.queue[G.idx], total = G.queue.length;

    body = `

        ? built.map((w,k)=>`<button class="ro-chip" ${G.answered?'disabled':''} onclick="gUnplace(${k})">${esc(k===0?cap(w):w)}</button>`).join('')
        : '<span class="ro-hint">點下面的單字，依序排出句子（點上面的字可以拿回來）</span>'}</div>
      <div class="ro-tiles">${G.tiles.map(ti=>G.placed.includes(ti) ? '' :

      ${G.answered ? '' : `<div class="action-row">

      </div>`}`;
  }
  const fb = G.answered ? `

    : (G.tries>0 ? `<div class="feedback bad">順序不太對，再試一次！（最後一次機會）</div>` : '');
  app.innerHTML = `

}
function gPick(i){
  const G = state.g;
  if(G.answered) return;
  const q = G.queue[G.idx];
  G.choice = i; G.answered = true; G.ok = (i===q.a);
  gRecord(q, G.ok);
  if(G.ok) speakText(gFullSentence());
  render(true);
}
function gPlace(ti){
  const G = state.g;
  if(G.answered || G.placed.includes(ti)) return;
  G.placed.push(ti); G.flash='';
  render(true);
}
function gUnplace(k){ const G=state.g; if(G.answered) return; G.placed.splice(k,1); render(true); }
function gClear(){ const G=state.g; if(G.answered) return; G.placed=[]; render(true); }
function gCheck(){
  const G = state.g, q = G.queue[G.idx];
  const got  = G.placed.map(i=>G.tokens[i]).join(' ').toLowerCase();
  const want = G.tokens.join(' ').toLowerCase();
  if(got===want){
    G.answered=true; G.ok=true; G.second=(G.tries>0);
    gRecord(q, G.tries===0);                 // 只有一次就排對才算答對
    speakText(q.s);
  } else if(G.tries===0){
    G.tries=1; G.placed=[]; G.flash='shake';
  } else {
    G.answered=true; G.ok=false;
    gRecord(q, false);
  }
  render(true);
}
function gRecord(q, ok){
  const p = DATA.gprog[q.id] || {a:0, c:0};
  p.a++; if(ok) p.c++;
  p.lastOk = ok; p.last = todayStr();
  DATA.gprog[q.id] = p;
  const G = state.g;
  G.results.push({q, ok});
  if(ok){ G.correct++; DATA.coins += 3; }
  saveData();
}
function gNext(){
  const G = state.g;
  G.idx++;
  if(G.idx>=G.queue.length){ finishGrammar(); return; }
  resetGQ();
  render();
}

function rSubmit(){
  const R = state.r, rd = READING.find(x=>x.id===R.id);
  const n = rd.questions.length;
  const score = rd.questions.filter((q,i)=>R.answers[i]===q.a).length;

  const p = DATA.rprog[rd.id] || {best:0, total:n, attempts:0};
  p.attempts++; p.total = n; p.best = Math.max(p.best||0, score); p.last = score; p.date = todayStr();
  DATA.rprog[rd.id] = p;
  DATA.coins += score*4;
  DATA.totalSessions = (DATA.totalSessions||0)+1;
  markPlayedToday();
  writeNow();
  render();
}
function nextReading(){
  const cur = READING.find(x=>x.id===state.r.id);
  const list = READING.filter(r=>r.level===cur.level);
  const i = list.findIndex(r=>r.id===cur.id);
  startReading(list[(i+1) % list.length].id);
}

/* =========================================================
   iPad 專用：實體鍵盤、螢幕不熄滅、語音解鎖
========================================================= */
// 接藍牙鍵盤／Magic Keyboard 的 iPad：直接打字拼單字，Backspace 清除一個字母
function typeLetter(ch){
  if(state.screen!=='battle' || modalOpen) return;
  const w = state.currentWord;
  if(!w || state.currentAttempt.length >= w.word.length) return;
  const idx = state.scrambled.findIndex((c,i)=> c===ch && !state.usedTileIdx.includes(i));
  if(idx>=0) tapTile(idx);
}
function onGlobalKey(e){
  if(modalOpen || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if(t && t.tagName && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if(state.screen!=='battle') return;
  if(e.key==='Backspace'){ e.preventDefault(); undoTile(); return; }
  if(e.key && e.key.length===1 && /[a-zA-Z-]/.test(e.key)){ e.preventDefault(); typeLetter(e.key.toLowerCase()); }
}
document.addEventListener('keydown', onGlobalKey);

// 練習時不讓 iPad 自動鎖定螢幕（iPadOS 16.4+ 支援；不支援就略過）
let wakeLock = null;
async function keepAwake(){
  try{
    if(typeof navigator!=='undefined' && 'wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }
  }catch(e){ wakeLock = null; }
}
// iOS 規定：第一次發聲必須由手指點擊觸發。第一次點擊時先「無聲」說一次，之後遊戲自動播放（答對後念整句）才會有聲音
let speechUnlocked = false;
function unlockSpeech(){
  if(speechUnlocked || !hasTTS) return;
  speechUnlocked = true;
  unlockAt = Date.now();
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// iOS 只承認 click / touchend 才算「手指點擊」（pointerdown 不算），所以聽這兩個事件
['click','touchend'].forEach(ev=> document.addEventListener(ev, ()=>{ unlockSpeech(); keepAwake(); }, {capture:true, passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keepAwake(); });

/* =========================================================
   啟動：先選擇勇者
========================================================= */
(async function init(){
  await detectStorage();
  // 請 Safari 把這個網站的資料標記為「持久」，降低被系統自動清除的機會（不支援就略過）
  try{ if(typeof navigator!=='undefined' && navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  await loadIndex();
  state.screen = 'profiles';
  render();
})();
</script>
